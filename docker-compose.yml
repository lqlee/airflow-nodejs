services:
  app:
    image: airflow-nodejs:local
    ports:
      - "3000:3000"
    mem_limit: 512m
    cpus: 1.0
    environment:
      MONGO_URL: mongodb://mongo:27017/airflow
      PORT: "3000"
      # Task log backend — 'file' (default) keeps MongoDB lean
      # Logs written to LOG_DIR inside the container, mounted to ./logs on host
      LOG_BACKEND: "file"
      LOG_DIR: "/app/logs"
    volumes:
      - ./dags:/app/dags
      - ./logs:/app/logs    # task log files — NOT checked in (see .gitignore)
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: airflow
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  mongo_data:
  redis_data:
